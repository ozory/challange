[project]
name = "finguard-backend"
version = "1.0.0"
description = "API para triagem inteligente de reclamações financeiras"
# readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pandas==2.1.4",
    "boto3==1.34.14",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "httpx==0.26.0",
    "truststore>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.uv]
dev-dependencies = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
]

[tool.uv.sources]
# Se precisar de dependências locais ou git
# fastapi = { git = "https://github.com/tiangolo/fastapi", tag = "0.109.0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]